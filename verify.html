<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weryfikacja danych - mObywatel</title>
  <style>
    body, html {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f2f4f8;
        color: #1a1a1a;
    }

    .app-container {
        max-width: 414px;
        margin: 0 auto;
        min-height: 100vh;
        background: #f2f4f8;
        padding-bottom: 30px;
    }

    /* Pasek górny */
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        background: #f2f4f8;
    }

    .back-btn {
        color: #2b569a;
        font-size: 17px;
        text-decoration: none;
        display: flex;
        align-items: center;
        font-weight: 400;
    }

    .back-btn::before {
        content: "‹";
        font-size: 24px;
        margin-right: 4px;
        line-height: 1;
        position: relative;
        top: -1px;
    }

    .header-title {
        font-size: 17px;
        font-weight: 600;
        color: #111;
        margin-right: 30px; /* wyśrodkowanie tytułu względem guzika powrotu */
    }

    .content {
        padding: 0 16px;
    }

    /* Zdjęcie profilowe */
    .photo-container {
        margin: 10px 0 16px 4px;
    }

    .profile-photo {
        width: 110px;
        height: 135px;
        border-radius: 12px;
        object-fit: cover;
        filter: grayscale(100%); /* Efekt czarno-białego zdjęcia */
        background-color: #ccc;
    }

    /* Karta statusu */
    .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .status-badge {
        display: inline-flex;
        align-items: center;
        background: #f0f7f0;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 13px;
        color: #2e7d32;
        font-weight: 500;
        margin-bottom: 12px;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        background-color: #4caf50;
        border-radius: 50%;
        margin-right: 6px;
    }

    .status-title {
        font-size: 19px;
        font-weight: 700;
        margin: 0 0 12px 0;
        color: #111;
    }

    .status-info {
        font-size: 13.5px;
        color: #666666;
        margin: 4px 0;
        line-height: 1.4;
    }

    .status-info strong {
        color: #222222;
        font-weight: 600;
    }

    /* Karta z danymi */
    .data-group {
        padding: 14px 0;
        border-bottom: 1px solid #f0f0f0;
    }

    .data-group:last-child {
        border-bottom: none;
        padding-bottom: 4px;
    }

    .data-group:first-child {
        padding-top: 4px;
    }

    .data-label {
        font-size: 13px;
        color: #7d8694;
        margin-bottom: 4px;
        font-weight: 400;
    }

    .data-value {
        font-size: 16px;
        font-weight: 600;
        color: #1a1a1a;
    }
  </style>
</head>
<body>

<div class="app-container">
    <!-- Pasek nawigacyjny -->
    <div class="header">
        <a href="#" class="back-btn">Wróć</a>
        <div class="header-title">Kod QR</div>
        <div></div>
    </div>

    <div class="content">
        <!-- Zdjęcie -->
        <div class="photo-container">
            <img class="profile-photo" src="images/Brat.png" alt="Zdjęcie profilowe" onerror="this.src='https://via.placeholder.com/110x135?text=Foto'">
        </div>

        <!-- Karta statusu -->
        <div class="card">
            <div class="status-badge">
                <span class="status-dot"></span>
                Potwierdzony
            </div>
            <h2 class="status-title">mDowód został potwierdzony</h2>
            <p class="status-info">Data i godzina weryfikacji: <span id="timeNow"></span></p>
            <p class="status-info">
    Certyfikat mDowodu jest ważny do<br>
    <strong id="certValidTo"></strong>
</p>
        </div>

        <!-- Karta z szczegółami -->
        <div class="card">
            <div class="data-group">
                <div class="data-label">Numer Pesel</div>
                <div class="data-value">73112473512</div>
            </div>

            <div class="data-group">
                <div class="data-label">Imię (imiona)</div>
                <div class="data-value">Lojalny</div>
            </div>

            <div class="data-group">
                <div class="data-label">Nazwisko</div>
                <div class="data-value">Kurwiszon</div>
            </div>

            <div class="data-group">
                <div class="data-label">Data wydania</div>
                <div class="data-value">21.02.2023</div>
            </div>
        </div>
    </div>
</div>

<script>
    const now = new Date();

    // Formatowanie bieżącej daty i godziny weryfikacji (np. 22.07.2026, 14:30)
    const formattedDate = now.toLocaleDateString('pl-PL') + ', ' + 
                          now.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
    document.getElementById("timeNow").innerText = formattedDate;

    // Formatowanie daty ważności certyfikatu (tylko data, np. 22.07.2026)
    const todayDate = now.toLocaleDateString('pl-PL');
    document.getElementById("certValidTo").innerText = todayDate;
</script>

</body>
</html>
